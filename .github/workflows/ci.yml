# CI du lakehouse CHU : monte la pile Docker sur un runner GitHub (bootstrap.sh), la remplit
# avec un Bronze S1 synthétique (aucune donnée réelle : RGPD, HDS), puis lance la chaîne Silver
# et les tests Silver et Gold. Durée indicative : 10 à 20 minutes, surtout le téléchargement des images.
name: CI Silver et Gold

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail : une commande en échec dans un tube fait échouer l'étape

jobs:
  silver-gold:
    name: Tests Silver et Gold
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Place disque pour les images Hadoop, Hive, Spark et NiFi
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Montage de la pile (bootstrap.sh, sans dump de la source)
        run: ./bootstrap.sh

      - name: Bronze S1 synthétique
        run: |
          docker cp tests/ci_bronze_s1.py chu_spark_master:/tmp/ci_bronze_s1.py
          docker exec chu_spark_master /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 /tmp/ci_bronze_s1.py 2>&1 \
            | grep -oE 'CI (bronze|attendus).*|\[ECHEC\].*|Traceback.*|[A-Za-z]*Error.*'

      - name: Chaîne Silver S1 (J10, J11, J12)
        run: ./run_silver_s1.sh

      - name: Tests Silver
        run: ./test_silver.sh

      - name: Référentiel département -> région (J05)
        run: |
          docker exec chu_spark_master /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 /jobs/j05_ref_departement.py 2>&1 | grep -E '^(J05QC|SILVER)'

      - name: Fait consultation J30 (mode test, dimensions provisoires)
        run: |
          docker exec -e J30_MODE=test chu_spark_master /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 /jobs/j30_fait_consultation.py 2>&1 \
            | tee /tmp/j30.log | grep -E '^GOLD'
          grep -q '^GOLDQC,perte_silver_fait,0$' /tmp/j30.log
          grep -q '^GOLDQC,doublons_id_consultation,0$' /tmp/j30.log
          grep -q '^GOLD fait_consultation ' /tmp/j30.log

      - name: Tests Gold (DDL, contraintes, jobs Gold, contenu Hive)
        run: ./test_gold.sh
        env:
          APPLIQUER_DDL: "1"
          LANCER_JOBS: "1"
          COMPARER_PG: "1"

      - name: Journaux des conteneurs en cas d'échec
        if: failure()
        run: |
          docker compose ps -a
          for c in chu_hive_metastore chu_namenode chu_datanode chu_spark_master chu_spark_worker chu_postgres; do
            echo "::group::$c"
            docker logs --tail 80 "$c" 2>&1 || true
            echo "::endgroup::"
          done