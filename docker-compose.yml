networks:
  chu_network:
    driver: bridge

volumes:
  postgres_data: {}
  nifi_data: {}
  nifi_conf: {}
  namenode_data: {}
  datanode_data: {}

services:
  postgres:
    image: postgres:15-alpine
    container_name: chu_postgres
    restart: always
    environment:
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - chu_network

  nifi:
    image: apache/nifi:1.25.0
    container_name: chu_nifi
    restart: always
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: "${NIFI_USER}"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_PASSWORD}"
      NIFI_WEB_PROXY_HOST: "${HOST_IP}:8443"
    volumes:
      - nifi_data:/opt/nifi/nifi-current/state
      - nifi_conf:/opt/nifi/nifi-current/conf
      - ./data:/data
      - ./drivers:/opt/nifi/drivers:ro
      - ./hadoop-conf:/opt/nifi/hadoop-conf:ro
    networks:
      - chu_network

  spark-master:
    image: apache/spark:3.5.1
    container_name: chu_spark_master
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - chu_network
    volumes:
      - ./data:/data
      - ./jobs:/jobs:ro

  spark-worker:
    image: apache/spark:3.5.1
    container_name: chu_spark_worker
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_WEBUI_PORT: "8081"
    ports:
      - "8081:8081"
    networks:
      - chu_network
    volumes:
      - ./data:/data

  namenode:
    image: apache/hadoop:3.3.6
    container_name: chu_namenode
    hostname: namenode
    networks:
      - chu_network
    user: root
    command: ["hdfs", "namenode"]
    mem_limit: 768m
    environment:
      ENSURE_NAMENODE_DIR: "/hadoop/dfs/name"
      HADOOP_HEAPSIZE_MAX: "512m"
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      HDFS-SITE.XML_dfs.namenode.rpc-address: "namenode:8020"
      HDFS-SITE.XML_dfs.namenode.name.dir: "/hadoop/dfs/name"
      HDFS-SITE.XML_dfs.replication: "1"
    ports:
      - "9870:9870"
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
      image: apache/hadoop:3.3.6
      container_name: chu_datanode
      hostname: datanode
      networks:
        - chu_network
      user: root
      command: ["hdfs", "datanode"]
      mem_limit: 512m
      depends_on:
        - namenode
      environment:
        HADOOP_HEAPSIZE_MAX: "256m"
        CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
        HDFS-SITE.XML_dfs.datanode.data.dir: "/hadoop/dfs/data"
        HDFS-SITE.XML_dfs.replication: "1"
      volumes:
        - datanode_data:/hadoop/dfs/data

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: chu_hive_metastore
    hostname: hive-metastore
    restart: always
    mem_limit: 768m
    depends_on:
      - postgres
      - namenode
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=${PG_USER}
        -Djavax.jdo.option.ConnectionPassword=${PG_PASSWORD}
        -Dhive.metastore.warehouse.dir=hdfs://namenode:8020/warehouse
    ports:
      - "9083:9083"
    networks:
      - chu_network
    volumes:
      - ./drivers/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-9.4.1208.jre7.jar:ro
